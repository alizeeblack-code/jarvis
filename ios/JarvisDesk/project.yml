# Jarvis Desk: a native (SwiftUI) desk display for an old iPhone. It polls Jarvis's
# GET /api/desk, keeps the screen on and chimes even with the silent switch on.
# Generate the Xcode project with `xcodegen generate` after ./configure.sh.
name: JarvisDesk
options:
  developmentLanguage: en
  deploymentTarget:
    iOS: "15.0"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # one lit lamp, JarvisDesk/Assets.xcassets
targets:
  JarvisDesk:
    type: application
    platform: iOS
    sources:
      - JarvisDesk
      - path: ../../static/sounds   # the same chimes the /desk page plays
        buildPhase: resources
    info:
      path: JarvisDesk/Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        CFBundleShortVersionString: "2.1"
        CFBundleVersion: "3"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationLandscapeLeft]
        UIBackgroundModes: []
        JarvisDeskURL: $(JARVIS_DESK_URL)
        NSLocalNetworkUsageDescription: Shows the status of the Jarvis running on your computer.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true   # Jarvis is plain http on the LAN / Tailscale
